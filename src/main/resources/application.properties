# Database - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/billingdb
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


## H2 Console
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=MyVerySecureSecretKeyThatShouldBeAtLeast256BitsLongForHS256AlgorithmChangeThis
jwt.expiration=86400000

# CORS
spring.webmvc.cors.allowed-origins=http://localhost:3000,http://localhost:3001
spring.webmvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
